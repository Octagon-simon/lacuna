<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Activity-bar icon: monochrome (VS Code tints it via currentColor). Coverage rows with one
       "gap" row dashed — the lacuna. Mirrors the full-color logo's motif. -->
  <rect x="3" y="4" width="12" height="2.4" rx="1.2" fill="currentColor"/>
  <rect x="3" y="9" width="9"  height="2.4" rx="1.2" fill="currentColor"/>
  <rect x="3" y="14" width="7"  height="2.4" rx="1.2" fill="currentColor"/>
  <rect x="12" y="14" width="9" height="2.4" rx="1.2" fill="currentColor" fill-opacity="0.35"
        stroke="currentColor" stroke-width="1" stroke-dasharray="1.6 1.6"/>
  <rect x="3" y="19" width="15" height="2.4" rx="1.2" fill="currentColor"/>
</svg>
