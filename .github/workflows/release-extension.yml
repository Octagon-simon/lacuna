name: Release Extension

# Fires on the namespaced extension tag pushed by extension/scripts/release.sh (npm run release:ext).
# The CLI's own Release workflow triggers on `v*` tags; the two never overlap.
on:
  push:
    tags:
      - 'ext-v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  publish-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # The extension bundles the CLI core (esbuild aliases lacuna-cli/lacuna-scaffold → ../dist) and
      # copies ../lacuna.schema.json, so the core MUST be built first.
      - name: Build CLI core
        run: |
          npm ci
          npm run build

      - name: Build + package extension
        working-directory: extension
        run: |
          npm ci
          npm run build
          VERSION="${GITHUB_REF_NAME#ext-v}"
          npx @vscode/vsce package --no-dependencies -o "lacuna-vscode-${VERSION}.vsix"

      - name: Publish to VS Code Marketplace
        working-directory: extension
        run: npx @vscode/vsce publish --packagePath "lacuna-vscode-${GITHUB_REF_NAME#ext-v}.vsix" -p "$VSCE_PAT"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      # Open VSX (Cursor / Windsurf / VSCodium / Antigravity). Publishes the SAME .vsix as above.
      # Needs an OVSX_TOKEN repo secret. For a new version both registries publish cleanly; to
      # re-publish only Open VSX for an already-Marketplace'd version, use `npm run publish:ovsx`
      # locally (see extension/package.json) — that path skips vsce so it won't error on a duplicate.
      - name: Publish to Open VSX
        working-directory: extension
        run: npx ovsx publish "lacuna-vscode-${GITHUB_REF_NAME#ext-v}.vsix" -p "$OVSX_TOKEN"
        env:
          OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}

      # A GitHub release with the .vsix attached — for direct/manual install (air-gapped setups,
      # Theia-based editors, or pinning an exact version). NOT marked --latest (that belongs to the
      # CLI's `v*` releases).
      - name: GitHub release (attach .vsix)
        working-directory: extension
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" ./lacuna-vscode-*.vsix \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
