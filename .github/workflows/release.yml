name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - run: npm run build

      - name: Commit dist and update tags
        run: |
          TAG="${GITHUB_REF_NAME}"                            # e.g. v1.2.3
          MAJOR="$(echo "$TAG" | sed 's/\([^.]*\).*/\1/')"  # e.g. v1

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Force-add dist/ even though it's in .gitignore (intentional — dist is
          # excluded from day-to-day commits but must be present in release tags
          # so the GitHub Action works without requiring users to run npm install)
          git add --force dist/

          if git diff --cached --quiet; then
            echo "dist/ is unchanged — tags already point to the correct commit."
          else
            git commit -m "chore: build dist for ${TAG} [skip ci]"

            # Another release (e.g. the extension in `release:all`) may have advanced main
            # between this tag's push and now — rebase the dist commit onto the latest main so
            # the push FAST-FORWARDS instead of racing (the non-fast-forward that aborted v0.4.0).
            git fetch origin main
            git rebase origin/main

            # Move the exact version tag to the (possibly rebased) commit that includes dist/
            git tag -fa "${TAG}" -m "Release ${TAG}"

            git push origin HEAD:main
            git push origin "${TAG}" --force
          fi

          # Always update the floating major tag (v1 → latest 1.x)
          git tag -fa "${MAJOR}" -m "Release ${TAG}"
          git push origin "${MAJOR}" --force

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Idempotent: a re-run of a partially-failed release (e.g. after npm publish 403'd
          # on an expired token) must not abort here just because the release already exists
          # from the earlier attempt — otherwise the job dies before reaching npm publish.
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists — skipping create."
          else
            gh release create "${TAG}" \
              --title "${TAG}" \
              --generate-notes \
              --latest
          fi

      - name: Publish to npm
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          # Idempotent: skip if this version is already on npm, so re-running a release whose
          # git/tag/GitHub-release steps already succeeded only performs the missing publish.
          if npm view "lacuna-cli@${VERSION}" version >/dev/null 2>&1; then
            echo "lacuna-cli@${VERSION} already published — skipping publish."
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
